[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iiti-aihub"
version = "0.5.0"
description = "IIT Indore AI Campus Assistant — Phase 4 campus interface"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.14,<2", "asyncpg>=0.30,<1", "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5", "Pillow>=12,<13", "PyMuPDF>=1.25,<2", "pydantic-settings>=2.7,<3", "llama-index-core==0.14.25", "qdrant-client==1.16.2",
  "fastembed==0.8.1", "openai==2.54.0", "httpx>=0.28,<1", "argon2-cffi>=25,<26", "google-auth>=2.40,<3",
  "CacheControl>=0.14,<1", "email-validator>=2.2,<3", "redis==6.2.0", "prometheus-client==0.22.1"
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "aiosqlite>=0.20,<1", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["backend*", "crawler*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
